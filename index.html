<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab52 庫存系統</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#212529;font-size:14px;}
.app{max-width:1100px;margin:0 auto;padding:1.5rem 1rem;}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px;}
.hdr-title{font-size:20px;font-weight:600;color:#212529;}
.dimtxt{font-size:11px;color:#6c757d;}
.upload-zone{border:1.5px dashed #ced4da;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem;background:#fff;}
.upload-title{font-size:13px;font-weight:600;color:#495057;margin-bottom:10px;}
.upload-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.upload-row:last-child{margin-bottom:0;}
.ulabel{font-size:12px;color:#6c757d;width:90px;flex-shrink:0;}
.ubtn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #ced4da;background:#fff;color:#495057;cursor:pointer;}
.ubtn:hover{background:#f8f9fa;}
.s-ok{color:#0f6e56;background:#e1f5ee;padding:3px 8px;border-radius:6px;font-size:12px;}
.s-wait{color:#6c757d;font-size:12px;}
.s-err{color:#a32d2d;background:#fcebeb;padding:3px 8px;border-radius:6px;font-size:12px;}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.25rem;}
.metric{background:#fff;border-radius:8px;padding:14px 16px;border:1px solid #e9ecef;}
.ml{font-size:12px;color:#6c757d;margin-bottom:4px;}
.mv{font-size:22px;font-weight:600;color:#212529;}
.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:1.25rem;}
.al{padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;}
.al-red{background:#fcebeb;border-left:3px solid #e24b4a;color:#501313;}
.al-amber{background:#faeeda;border-left:3px solid #ef9f27;color:#633806;}
.main-card{background:#fff;border-radius:12px;border:1px solid #e9ecef;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid #e9ecef;overflow-x:auto;}
.tab{font-size:13px;padding:10px 16px;cursor:pointer;color:#6c757d;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:#212529;border-bottom:2px solid #378add;font-weight:600;}
.tab:hover{color:#212529;background:#f8f9fa;}
.toolbar{display:flex;gap:8px;padding:1rem;border-bottom:1px solid #e9ecef;flex-wrap:wrap;}
.toolbar input{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #ced4da;background:#fff;color:#212529;flex:1;min-width:160px;}
.toolbar select{font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid #ced4da;background:#fff;color:#212529;}
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-size:11px;font-weight:600;color:#6c757d;text-align:left;padding:8px 12px;border-bottom:1px solid #e9ecef;white-space:nowrap;background:#f8f9fa;}
td{padding:8px 12px;border-bottom:1px solid #f1f3f5;color:#212529;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f8f9fa;}
.section-row td{background:#f1f3f5;font-size:11px;font-weight:700;color:#6c757d;padding:5px 12px;letter-spacing:0.08em;text-transform:uppercase;}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap;}
.b-ok{background:#e1f5ee;color:#0f6e56;}
.b-warn{background:#faeeda;color:#854f0b;}
.b-alert{background:#fcebeb;color:#a32d2d;}
.b-ng{background:#f1efea;color:#5f5e5a;}
.b-transit{background:#eeedfe;color:#3c3489;}
.num{text-align:right;}
.exp-warn{color:#d85a30;font-weight:600;}
.exp-critical{color:#a32d2d;font-weight:600;}
.empty-row td{text-align:center;padding:2rem;color:#6c757d;}
input[type=number]{width:80px;padding:4px 8px;border-radius:6px;border:1px solid #ced4da;background:#fff;color:#212529;font-size:13px;text-align:right;}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span class="hdr-title">Lab52 庫存系統</span>
    <span id="lastUpdate" class="dimtxt"></span>
  </div>
  <div class="upload-zone">
    <div class="upload-title">上傳報告更新庫存</div>
    <div class="upload-row">
      <span class="ulabel">台灣倉</span>
      <label class="ubtn">選擇檔案<input type="file" accept=".xls,.html" style="display:none" onchange="handleFile('tw',this)"></label>
      <span class="dimtxt">ezlogistics .xls</span>
      <span id="tw-st"><span class="s-wait">未上傳</span></span>
    </div>
    <div class="upload-row">
      <span class="ulabel">FBA</span>
      <label class="ubtn">選擇檔案<input type="file" accept=".csv,.txt" style="display:none" onchange="handleFile('fba',this)"></label>
      <span class="dimtxt">Seller Central .csv</span>
      <span id="fba-st"><span class="s-wait">未上傳</span></span>
    </div>
    <div class="upload-row">
      <span class="ulabel">美國外倉</span>
      <label class="ubtn">選擇檔案<input type="file" accept=".xlsx" style="display:none" onchange="handleFile('wh',this)"></label>
      <span class="dimtxt">AMZLG&S .xlsx</span>
      <span id="wh-st"><span class="s-wait">未上傳</span></span>
    </div>
  </div>
  <div id="summaryGrid" class="metric-grid" style="display:none"></div>
  <div id="alertsBox" class="alerts"></div>
  <div id="mainContent" class="main-card" style="display:none">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview')">庫存總覽</div>
      <div class="tab" onclick="switchTab('restock')">補貨建議</div>
      <div class="tab" onclick="switchTab('transit')">在途管理</div>
      <div class="tab" onclick="switchTab('wh')">美國外倉</div>
      <div class="tab" onclick="switchTab('fba')">FBA</div>
      <div class="tab" onclick="switchTab('tw')">台灣倉</div>
    </div>
    <div class="toolbar">
      <input type="text" placeholder="搜尋商品名稱或 EAN..." oninput="renderTable()" id="srch">
      <select onchange="renderTable()" id="fltStatus">
        <option value="">全部狀態</option>
        <option value="fba-alert">FBA 需補貨</option>
        <option value="po-alert">需採購</option>
      </select>
    </div>
    <div class="tw"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
  <div id="emptyMsg" style="text-align:center;padding:3rem;color:#6c757d;">上傳任一報告檔案，系統自動解析整合庫存數據</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SKEY='lab52_inv_v6';
const CATALOG=[
  {ean:'4714781020015',name:'Kids Oral Spray Strawberry',cat:'單支噴霧',monthly:2400},
  {ean:'4714781020022',name:'Kids Oral Spray Watermelon',cat:'單支噴霧',monthly:1100},
  {ean:'4714781022224',name:'Kids Oral Spray Grape',cat:'單支噴霧',monthly:1200},
  {ean:'4714781022231',name:'Kids Oral Spray Vanilla',cat:'單支噴霧',monthly:950},
  {ean:'4714781022248',name:'Kids Oral Spray Flavor Free',cat:'單支噴霧',monthly:700},
  {ean:'4714781020756',name:'Kids Oral Spray Peach',cat:'單支噴霧',monthly:200},
  {ean:'4714781023580',name:'Kids Oral Spray Strawberry+Grape',cat:'雙入噴霧',monthly:450},
  {ean:'4714781023603',name:'Kids Oral Spray Strawberry+Vanilla',cat:'雙入噴霧',monthly:250},
  {ean:'4714781023597',name:'Kids Oral Spray Strawberry+Peach',cat:'雙入噴霧',monthly:250},
  {ean:'4714781023412',name:'Kids Oral Spray Strawberry+Watermelon',cat:'雙入噴霧',monthly:200},
  {ean:'4714781023122',name:'Kids Oral Spray Strawberry Trio',cat:'三入噴霧',monthly:150},
  {ean:'4714781023115',name:'Kids Oral Spray Grape Trio',cat:'三入噴霧',monthly:130},
  {ean:'4714781020084',name:'Probiotic Oral Spray Apple Mint',cat:'成人噴霧',monthly:700},
  {ean:'4714781020060',name:'Kids Toothpaste Strawberry',cat:'牙膏',monthly:150},
  {ean:'4714781020077',name:'Kids Toothpaste Watermelon',cat:'牙膏',monthly:150},
];
const EAN_MAP=Object.fromEntries(CATALOG.map(p=>[p.ean,p]));
const TW2EAN={'4714781022217':'4714781020015','4714781022255':'4714781020756'};
const FBA2EAN={
  'AD-0001':'4714781020084','Grape_Spray_Kids':'4714781022224',
  'Milk_Kids_Spray':'4714781022231','FlavorFree_Spray_Kids':'4714781022248',
  'FlavorFree_Spray_KIDS':'4714781022248','Peach_Spray_Kids':'4714781020756',
  'Stawberry_Spray_Kids':'4714781020015','StrawberryNHAP':'4714781020060',
  'WatermelonNHAP':'4714781020077','Watermelon-spray':'4714781020022',
  'D6-1MWN-Q0EN':'4714781023580','M2-6V1S-09J4':'4714781023603',
  'F8-1THT-CLFU':'4714781023115','TU-V4OB-07QB':'4714781023597',
  'Strawberry+Watermelon':'4714781023412','Peach-spray':'4714781020756',
  'PEACH-SPRAY':'4714781020756','CG-3XYS-TGEJ':'4714781023122',
  'StrawberrySprayBox':'4714781020015','XI-MN9Y-L5CY':'4714781020015',
};
let S=loadS(),curTab='overview';
function loadS(){try{const r=localStorage.getItem(SKEY);if(r){const d=JSON.parse(r);if(!d.transit)d.transit={};return d;}}catch(e){}return{lu:null,tw:[],fba:[],wh:[],transit:{}};}
function saveS(){S.lu=new Date().toISOString();localStorage.setItem(SKEY,JSON.stringify(S));}
function handleFile(type,inp){
  const f=inp.files[0];if(!f)return;
  const st=document.getElementById(type+'-st');
  st.innerHTML='<span class="s-wait">解析中...</span>';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      if(type==='fba')parseFBA(e.target.result);
      else if(type==='tw')parseTW(e.target.result);
      else if(type==='wh')parseWH(e.target.result);
      st.innerHTML=`<span class="s-ok">✓ ${f.name}</span>`;
      saveS();renderAll();
    }catch(err){st.innerHTML=`<span class="s-err">失敗: ${err.message}</span>`;}
  };
  if(type==='tw')reader.readAsText(f,'big5');
  else reader.readAsArrayBuffer(f);
}
function parseFBA(buf){
  const text=new TextDecoder('utf-8').decode(buf);
  const lines=text.split('\n').filter(l=>l.trim());
  const hdr=csvLine(lines[0]);
  const si=hdr.findIndex(h=>h==='sku'),fi=hdr.findIndex(h=>h==='afn-fulfillable-quantity');
  const ii=hdr.findIndex(h=>h==='afn-inbound-shipped-quantity'),ri=hdr.findIndex(h=>h==='afn-reserved-quantity');
  if(si<0||fi<0)throw new Error('找不到必要欄位');
  S.fba=[];
  for(let i=1;i<lines.length;i++){
    const c=csvLine(lines[i]);const sku=(c[si]||'').trim();if(!sku)continue;
    const ean=FBA2EAN[sku]||'';if(!ean)continue;
    S.fba.push({sku,ean,fulfillable:parseInt(c[fi])||0,inbound:parseInt(c[ii])||0,reserved:parseInt(c[ri])||0});
  }
}
function parseTW(text){
  const parser=new DOMParser();const doc=parser.parseFromString(text,'text/html');
  const rows=doc.querySelectorAll('table tr');S.tw=[];let inData=false;
  rows.forEach(row=>{
    const cells=Array.from(row.querySelectorAll('td')).map(td=>td.textContent.trim());
    if(cells.includes('貨品料號')){inData=true;return;}
    if(!inData)return;
    if(cells[0]&&/^\d{13}$/.test(cells[0])){
      const rawEan=cells[0],ean=TW2EAN[rawEan]||rawEan;
      if(!EAN_MAP[ean])return;
      S.tw.push({ean,rawEan,twName:cells[1],quality:cells[2],batch:cells[4]||'—',qty:parseInt(cells[5])||0,expiry:cells[7]||'—'});
    }
  });
}
function parseWH(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const ws=wb.Sheets['Inventory'];if(!ws)throw new Error('找不到 Inventory sheet');
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const whMap={};let inSection=false;
  for(let i=0;i<data.length;i++){
    const row=data[i];const name=row[0]?String(row[0]).trim():'';
    if(name==='正貨可入FBA倉'){inSection=true;continue;}
    if(!inSection)continue;
    const eanRaw=row[2];if(!eanRaw)continue;
    const ean=String(Math.round(parseFloat(eanRaw)));
    if(!EAN_MAP[ean])continue;
    const pcs=row[26];const qty=typeof pcs==='number'?Math.round(pcs):0;if(qty===0)continue;
    const expRaw=row[6];let expiry='—';
    if(expRaw instanceof Date)expiry=expRaw.toLocaleDateString('zh-TW');
    else if(typeof expRaw==='string'&&expRaw)expiry=expRaw;
    if(!whMap[ean])whMap[ean]={ean,qty:0,expiry};
    whMap[ean].qty+=qty;
    if(expiry!=='—'&&(whMap[ean].expiry==='—'||new Date(expiry.replace(/\//g,'-'))<new Date(whMap[ean].expiry.replace(/\//g,'-'))))whMap[ean].expiry=expiry;
  }
  S.wh=Object.values(whMap);
}
function csvLine(line){
  const res=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){inQ=!inQ;}else if(line[i]===','&&!inQ){res.push(cur.trim());cur='';}else cur+=line[i];
  }
  res.push(cur.trim());return res;
}
function getMerged(){
  const map={};
  CATALOG.forEach(p=>{map[p.ean]={...p,tw:0,wh:0,whExpiry:'—',fba:0,fbaInbound:0,transit:S.transit[p.ean]||0};});
  S.tw.forEach(r=>{if(map[r.ean]&&r.quality==='良品')map[r.ean].tw+=r.qty;});
  S.wh.forEach(r=>{if(map[r.ean]){map[r.ean].wh+=r.qty;map[r.ean].whExpiry=r.expiry;}});
  const fa={};S.fba.forEach(r=>{if(!fa[r.ean])fa[r.ean]={f:0,i:0};fa[r.ean].f+=r.fulfillable;fa[r.ean].i+=r.inbound;});
  Object.entries(fa).forEach(([ean,v])=>{if(map[ean]){map[ean].fba=v.f;map[ean].fbaInbound=v.i;}});
  return CATALOG.map(p=>map[p.ean]);
}
function fbaWeeks(i){return i.monthly>0?i.fba/i.monthly*4.33:99;}
function totalMonths(i){const t=i.tw+i.wh+i.fba+i.transit;return i.monthly>0?t/i.monthly:99;}
function fbaRestockQty(i){if(fbaWeeks(i)<6&&i.monthly>0){return Math.max(0,Math.ceil(i.monthly*3)-i.fba-i.fbaInbound);}return 0;}
function poRestockQty(i){if(totalMonths(i)<4&&i.monthly>0){return Math.max(0,Math.ceil(i.monthly*6)-(i.tw+i.wh+i.fba+i.transit));}return 0;}
function expClass(e){if(!e||e==='—')return'';const d=(new Date(e.replace(/\//g,'-'))-new Date())/864e5;return d<90?'exp-critical':d<180?'exp-warn':'';}
function switchTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['overview','restock','transit','wh','fba','tw'][i]===t));
  renderTable();
}
function updateTransit(ean,val){S.transit[ean]=parseInt(val)||0;saveS();renderAll();}
function renderAll(){
  const hasData=S.fba.length||S.tw.length||S.wh.length;
  document.getElementById('emptyMsg').style.display=hasData?'none':'';
  document.getElementById('mainContent').style.display=hasData?'':'none';
  document.getElementById('summaryGrid').style.display=hasData?'':'none';
  if(!hasData)return;
  const merged=getMerged();
  const fbaA=merged.filter(i=>fbaWeeks(i)<6&&i.monthly>0);
  const poA=merged.filter(i=>totalMonths(i)<4&&i.monthly>0);
  const tFBA=S.fba.reduce((a,r)=>a+r.fulfillable,0);
  const tWH=S.wh.reduce((a,r)=>a+r.qty,0);
  const tTW=S.tw.filter(r=>r.quality==='良品').reduce((a,r)=>a+r.qty,0);
  const tTr=Object.values(S.transit).reduce((a,v)=>a+v,0);
  document.getElementById('summaryGrid').innerHTML=`
    <div class="metric"><div class="ml">FBA 可售</div><div class="mv">${tFBA.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">美國外倉</div><div class="mv">${tWH.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">台灣倉</div><div class="mv">${tTW.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">台灣→美國在途</div><div class="mv">${tTr.toLocaleString()}</div></div>
    <div class="metric"><div class="ml">FBA 需補貨</div><div class="mv" style="color:${fbaA.length?'#a32d2d':'#212529'}">${fbaA.length}</div></div>
    <div class="metric"><div class="ml">需採購下單</div><div class="mv" style="color:${poA.length?'#854f0b':'#212529'}">${poA.length}</div></div>`;
  let ah='';
  fbaA.forEach(i=>{const q=fbaRestockQty(i);ah+=`<div class="al al-red"><i class="ti ti-alert-circle"></i><span><strong>${i.name}</strong> — FBA 僅剩 ${fbaWeeks(i).toFixed(1)} 週｜建議從外倉補 <strong>${q.toLocaleString()} 件</strong>（補到 3 個月）</span></div>`;});
  poA.forEach(i=>{const q=poRestockQty(i);ah+=`<div class="al al-amber"><i class="ti ti-alert-triangle"></i><span><strong>${i.name}</strong> — 總庫存 ${totalMonths(i).toFixed(1)} 個月｜建議下單 <strong>${q.toLocaleString()} 件</strong>（含 2 個月生產週期，補到 6 個月）</span></div>`;});
  document.getElementById('alertsBox').innerHTML=ah;
  if(S.lu)document.getElementById('lastUpdate').textContent='更新：'+new Date(S.lu).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  renderTable();
}
function renderTable(){
  const srch=(document.getElementById('srch')||{}).value||'';
  const flt=(document.getElementById('fltStatus')||{}).value||'';
  const merged=getMerged().filter(i=>{
    if(srch&&!i.name.toLowerCase().includes(srch.toLowerCase())&&!i.ean.includes(srch))return false;
    if(flt==='fba-alert'&&fbaWeeks(i)>=6)return false;
    if(flt==='po-alert'&&totalMonths(i)>=4)return false;
    return true;
  });
  let html='',thHtml='';
  if(curTab==='overview'){
    thHtml=`<tr><th>EAN</th><th>商品名稱</th><th class="num">月銷</th><th class="num">台灣倉</th><th class="num">外倉</th><th class="num">在途</th><th class="num">FBA</th><th class="num">外→FBA在途</th><th class="num">FBA週數</th><th class="num">總月數</th></tr>`;
    let lc='';
    merged.forEach(i=>{
      if(i.cat!==lc){html+=`<tr class="section-row"><td colspan="10">${i.cat}</td></tr>`;lc=i.cat;}
      const fw=fbaWeeks(i),tm=totalMonths(i);
      html+=`<tr><td class="dimtxt">${i.ean}</td><td>${i.name}</td><td class="num">${i.monthly}</td><td class="num">${i.tw||'—'}</td><td class="num">${i.wh||'—'}</td><td class="num">${i.transit||'—'}</td><td class="num">${i.fba||'—'}</td><td class="num">${i.fbaInbound?'<span class="badge b-transit">'+i.fbaInbound+'</span>':'—'}</td><td class="num"><span class="badge ${fw<6?'b-alert':fw<10?'b-warn':'b-ok'}">${fw>=99?'—':fw.toFixed(1)+'W'}</span></td><td class="num"><span class="badge ${tm<4?'b-warn':'b-ok'}">${tm>=99?'—':tm.toFixed(1)+'M'}</span></td></tr>`;
    });
  } else if(curTab==='restock'){
    thHtml=`<tr><th>商品名稱</th><th class="num">月銷</th><th class="num">FBA 週數</th><th class="num">FBA 補貨建議</th><th class="num">總庫存月數</th><th class="num">採購建議</th></tr>`;
    let lc='';
    merged.forEach(i=>{
      if(i.cat!==lc){html+=`<tr class="section-row"><td colspan="6">${i.cat}</td></tr>`;lc=i.cat;}
      const fw=fbaWeeks(i),tm=totalMonths(i),fq=fbaRestockQty(i),pq=poRestockQty(i);
      html+=`<tr><td>${i.name}</td><td class="num">${i.monthly}</td><td class="num"><span class="badge ${fw<6?'b-alert':fw<10?'b-warn':'b-ok'}">${fw>=99?'—':fw.toFixed(1)+'W'}</span></td><td class="num">${fq>0?`<span class="badge b-alert">補 ${fq.toLocaleString()} 件</span>`:'<span class="badge b-ok">充足</span>'}</td><td class="num"><span class="badge ${tm<4?'b-warn':'b-ok'}">${tm>=99?'—':tm.toFixed(1)+'M'}</span></td><td class="num">${pq>0?`<span class="badge b-warn">下單 ${pq.toLocaleString()} 件</span>`:'<span class="badge b-ok">充足</span>'}</td></tr>`;
    });
  } else if(curTab==='transit'){
    thHtml=`<tr><th>EAN</th><th>商品名稱</th><th class="num">月銷</th><th class="num">台灣→美國 在途（手填）</th><th class="num">外倉→FBA 在途（自動）</th></tr>`;
    let lc='';
    CATALOG.forEach(p=>{
      const i=merged.find(x=>x.ean===p.ean);if(!i)return;
      if(i.cat!==lc){html+=`<tr class="section-row"><td colspan="5">${i.cat}</td></tr>`;lc=i.cat;}
      html+=`<tr><td class="dimtxt">${i.ean}</td><td>${i.name}</td><td class="num">${i.monthly}</td><td class="num"><input type="number" min="0" value="${S.transit[i.ean]||0}" onchange="updateTransit('${i.ean}',this.value)"></td><td class="num">${i.fbaInbound?'<span class="badge b-transit">'+i.fbaInbound.toLocaleString()+'</span>':'—'}</td></tr>`;
    });
  } else if(curTab==='wh'){
    thHtml=`<tr><th>EAN</th><th>商品名稱</th><th class="num">外倉件數</th><th>最近效期</th></tr>`;
    S.wh.filter(r=>!srch||EAN_MAP[r.ean]?.name.toLowerCase().includes(srch.toLowerCase())||r.ean.includes(srch))
    .forEach(r=>{const ec=expClass(r.expiry);html+=`<tr><td class="dimtxt">${r.ean}</td><td>${EAN_MAP[r.ean]?.name||r.ean}</td><td class="num">${r.qty.toLocaleString()}</td><td class="${ec}">${r.expiry}${ec==='exp-critical'?' ⚠':ec==='exp-warn'?' △':''}</td></tr>`;});
    if(!S.wh.length)html=`<tr class="empty-row"><td colspan="4">尚未上傳外倉 xlsx</td></tr>`;
  } else if(curTab==='fba'){
    thHtml=`<tr><th>SKU</th><th>EAN</th><th>商品名稱</th><th class="num">可售</th><th class="num">在途</th><th class="num">月銷</th><th class="num">FBA 週數</th></tr>`;
    S.fba.filter(r=>!srch||EAN_MAP[r.ean]?.name.toLowerCase().includes(srch.toLowerCase())||r.sku.toLowerCase().includes(srch.toLowerCase()))
    .forEach(r=>{const p=EAN_MAP[r.ean];const fw=p?.monthly?r.fulfillable/p.monthly*4.33:99;html+=`<tr><td class="dimtxt">${r.sku}</td><td class="dimtxt">${r.ean}</td><td>${p?.name||r.ean}</td><td class="num">${r.fulfillable.toLocaleString()}</td><td class="num">${r.inbound?'<span class="badge b-transit">'+r.inbound+'</span>':'—'}</td><td class="num">${p?.monthly||'—'}</td><td class="num"><span class="badge ${fw<6?'b-alert':fw<10?'b-warn':'b-ok'}">${fw>=99?'—':fw.toFixed(1)+'W'}</span></td></tr>`;});
    if(!S.fba.length)html=`<tr class="empty-row"><td colspan="7">尚未上傳 FBA CSV</td></tr>`;
  } else if(curTab==='tw'){
    thHtml=`<tr><th>EAN</th><th>商品名稱</th><th>批號</th><th class="num">數量</th><th>效期</th><th>品質</th></tr>`;
    S.tw.filter(r=>!srch||EAN_MAP[r.ean]?.name.toLowerCase().includes(srch.toLowerCase())||r.ean.includes(srch))
    .forEach(r=>{const ec=expClass(r.expiry);html+=`<tr><td class="dimtxt">${r.rawEan||r.ean}</td><td>${EAN_MAP[r.ean]?.name||r.ean}</td><td><span class="badge b-ng">${r.batch}</span></td><td class="num">${r.qty.toLocaleString()}</td><td class="${ec}">${r.expiry}${ec==='exp-critical'?' ⚠':ec==='exp-warn'?' △':''}</td><td><span class="badge ${r.quality==='良品'?'b-ok':'b-ng'}">${r.quality}</span></td></tr>`;});
    if(!S.tw.length)html=`<tr class="empty-row"><td colspan="6">尚未上傳台灣倉 xls</td></tr>`;
  }
  document.getElementById('thead').innerHTML=thHtml;
  document.getElementById('tbody').innerHTML=html;
}
renderAll();
</script>
</body>
</html>
